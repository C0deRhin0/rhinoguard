[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rhinoguard"
version = "0.1.0"
description = "A local-first purple-team harness for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Wilfredo Paulo A. Perez III" }]
keywords = ["ai-security", "agentic-ai", "red-team", "prompt-injection", "owasp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0,<7",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
rhinoguard = "rhinoguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rhinoguard"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/rhinoguard/reports/html_report.py" = ["E501"]
# Refine the surrounding context for pyproject
